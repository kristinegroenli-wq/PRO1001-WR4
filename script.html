<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <link rel="stylesheet" href="./style.css">
        <!-- Links from scrimba video in module 6-->
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300&display=swap" rel="stylesheet">
        <title>PRO1001 WR4 - Products rating dashboard</title>
       
    </head>
    <body>
        <header> 
            <h1>Product Ratings Dashboard</h1>
            <nav> 
                <ul>
                    <li><a href="#score-chart">Product rating scores</a></li>
                    <li><a href="#rating-range-chart">Rating range</a></li>
                </ul>
            </nav>
        
        </header>
        <main>
            <section id="ratingscores">
                <h2>Rating scores for each product</h2>
                <div id="score-chart"></div>
                <p class="ratingscoresComment">The chart displays the rating scores for each product
                </p>
            </section>

            <section id="ratingrange">
                <h2>Rating range</h2>
                <div id="rating-range-chart"></div>
                <p class="ratingrangeComment">The pie chart displays the amount of products in each rating group
                </p>
            </section>
        </main>

        <footer> 
            <p>PRO1001 Work requirement 4 - Products rating dashboard</p>
        </footer>

    
      <!--<script src="https://code.highcharts.com/highcharts.js"></script>, had to use another URL because of hotlinking restrictions-->
        <script src="https://cdn.jsdelivr.net/npm/highcharts/highcharts.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/highcharts/modules/accessibility.js"></script>
     <script src="./script.js"></script>
    </body>



</html>
